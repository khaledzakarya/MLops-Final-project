[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet_breed_classifier"
version = "1.0.0"
description = "ITI MLOps Track C: Pet Breed Classification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "Pillow>=9.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "dvc>=3.0.0",
    "bentoml>=1.1.0",
    "evidently>=0.4.0",
    "locust>=2.15.0",
    "mlflow>=2.5.0"
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0"
]
gdrive = [
    "dvc[gdrive]>=3.0.0"
]
full = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "dvc[gdrive]>=3.0.0"
]

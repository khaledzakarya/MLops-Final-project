[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pet_breed"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch", "torchvision", "pandas", "scikit-learn",
    "albumentations", "bentoml", "dvc", "fastapi", "pydantic"
]

[tool.setuptools.packages.find]
where = ["src"]

version: '3.8'

services:
  pet-breed-service:
    image: pet-breed:latest
    ports:
      - "8000:3000"  # Expose on 8000 as per rubric, BentoML internally uses 3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
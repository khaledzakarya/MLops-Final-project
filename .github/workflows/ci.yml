name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest bentoml torch torchvision onnxruntime Pillow numpy

    - name: 1. Linting
      run: |
        flake8 service.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 2. Test Baseline Quality Gate
      run: |
        python test_baseline.py

    - name: 3. Build BentoML and Dockerize
      run: |
        bentoml build